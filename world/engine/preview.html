<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Room engine preview</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    html,body{margin:0;height:100%;background:#07060f;color:#e9e4da;
      font:12px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
    canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
    #meta{position:fixed;left:14px;bottom:12px;max-width:52ch;line-height:1.6;
      text-shadow:0 1px 8px #000;pointer-events:none}
    #meta b{color:#f2d6a0}
  </style>
</head>
<body>
<!--
  A bench, not a page. It exists so a model can build one room from one spec and get pixels
  back without going through the journey, the route table, or any of trip.js. Nothing links
  here and robots are told to stay out.

  Load a spec with ?room=<id>; ids come from engine/rooms.js.
-->
<canvas id="view" aria-label="Room engine preview"></canvas>
<div id="meta"></div>

<script src="../vendor/three.min.js"></script>
<script src="../fractal.js"></script>
<script src="primitives.js"></script>
<script src="rooms.js"></script>
<script src="compile.js"></script>
<script>
(() => {
  'use strict';
  const T = THREE, F = window.FractalWorld;
  const id = new URLSearchParams(location.search).get('room')
    || Object.keys(window.RoomSpecs || {})[0];
  const spec = (window.RoomSpecs || {})[id];
  const meta = document.getElementById('meta');
  if (!spec) { meta.textContent = 'no such room: ' + id; return; }

  const canvas = document.getElementById('view');
  const renderer = new T.WebGLRenderer({ canvas, antialias: false, alpha: false });
  renderer.setPixelRatio(1);
  renderer.setSize(innerWidth, innerHeight, false);
  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(62, innerWidth / innerHeight, .05, 260);
  const composite = F.compositor(renderer);

  const root = new T.Group();
  scene.add(root);
  const materials = [], motions = [];
  let built = null, error = null;
  try {
    built = window.RoomEngine.build(spec, F, root, materials, motions);
  } catch (err) {
    error = err.message;
  }

  const entry = (spec.entry && spec.entry.z) || 9;
  camera.position.set(0, 1.7, entry);
  camera.rotation.set(0, 0, 0);

  meta.innerHTML = error ? ('<b>build failed</b><br>' + error)
    : ('<b>' + spec.name + '</b><br>' + spec.elements.length + ' elements · '
       + built.evidence.length + ' cited nodes<br>' + spec.hint);

  let animTime = 0, frames = 0, last = performance.now();
  // Same three lines the journey runs: materials advance on a clock, motions are callbacks,
  // the compositor draws. Keeping them identical is what makes a preview frame comparable to
  // a frame captured from the journey itself.
  function frame() {
    const now = performance.now();
    animTime += Math.min(.05, (now - last) / 1000);
    last = now;
    for (const m of materials) if (m.uniforms && m.uniforms.time) m.uniforms.time.value = animTime;
    for (const fn of motions) fn(animTime);
    composite.render(scene, camera, .8, animTime, .03, 0);
    frames++;
    requestAnimationFrame(frame);
  }
  if (!error) requestAnimationFrame(frame);

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight, false);
    composite.resize();
  });

  // The bench reports its own state, the way the journey does, so the driver never has to
  // infer anything from a picture.
  window.roomDiagnostics = () => ({
    room: spec.id,
    name: spec.name,
    error,
    elements: spec.elements.length,
    builtPrimitives: built ? built.built : [],
    evidence: built ? built.evidence : [],
    expect: spec.expect,
    frames,
    animTime,
    ready: !error && frames > 2,
    drawables: (() => { let n = 0; root.traverse(o => { if (o.isMesh || o.isPoints) n++; }); return n; })(),
    uncited: (() => {
      let n = 0;
      root.traverse(o => { if ((o.isMesh || o.isPoints) && !(o.userData.evidence || []).length) n++; });
      return n;
    })(),
    triangles: renderer.info.render.triangles,
    position: camera.position.toArray()
  });
})();
</script>
</body>
</html>
